[project]
name = "spr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "scikit-learn>=1.5", "shap>=0.46", "joblib>=1.3", "numpy>=1.26", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "sqlalchemy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
realdata = ["pandas>=2.2", "kaggle>=1.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
